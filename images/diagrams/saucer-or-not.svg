<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Diagram. On the left a teacup candle stands on its saucer, which catches drips, keeps heat off the table and gives a wider base that is harder to knock over. On the right, cups with no saucer stand on a side plate or on a ceramic tile or coaster instead. Not on a doily, napkin or plastic coaster."><rect width="620" height="300" rx="14" fill="#fbf7f1"/><defs><marker id="sa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a64b52"/></marker></defs><path d="M57 179 Q155 193 253 179 L241 185.3 Q155 193.7 69 185.3 Z" fill="#fff" stroke="#273a41" stroke-width="2.4" stroke-linejoin="round"/><path d="M95.0 105 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z" fill="#fff"/><clipPath id="u1"><path d="M95.0 105 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z"/></clipPath><g clip-path="url(#u1)"><rect x="90.0" y="117" width="130" height="90" fill="#f3e6c9"/></g><path d="M95.0 105 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M212.0 117.0 c30.0 -6 32.400000000000006 36.0 2.4 44.0" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M155 117V111" stroke="#273a41" stroke-width="2"/><g transform="translate(155 113) scale(0.9)"><path d="M0 -24 c-6 10 -7 16 -2 21 2 2 6 2 7 -2 2 -6 -2 -12 -5 -19z" fill="#f29b38"/><path d="M0 -14 c-2 5 -2 7 0 9 2 -2 2 -6 0 -9z" fill="#fff2c4"/></g><text x="155" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#4c718e">On a saucer</text><path d="M67 177 L43 135" stroke="#a64b52" stroke-width="1.5"/><text x="43" y="127" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a64b52">catches drips</text><path d="M57 211H253" stroke="#5b6b70" stroke-width="1.5" marker-start="url(#sa)" marker-end="url(#sa)"/><text x="155" y="233" text-anchor="middle" font-fami