<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-label="Simple map of the six towns of Stoke-on-Trent from north to south: Tunstall, Burslem, Hanley, Stoke, Fenton and Longton, each marked with a bottle oven, with the Trent and Mersey Canal running down the western side. Fenton is marked as the town Arnold Bennett left out of his Five Towns."><rect width="420" height="520" rx="14" fill="#fbf7f1"/><text x="210.0" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#273a41">The six towns, north to south</text><path d="M70 100 C110 120 150 150 160 180 S 200 250 190 270 S 150 320 140 360 S 110 440 90 490" fill="none" stroke="#4c718e" stroke-width="4" stroke-dasharray="10 6" opacity=".7"/><text x="20" y="420" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#4c718e" font-style="italic">Trent and Mersey</text><text x="20" y="436" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#4c718e" font-style="italic">Canal</text><text x="205" y="272" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#5b6b70" font-style="italic">Etruria</text><text x="406" y="506" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#5b6b70" font-style="italic">Not to scale</text><polyline points="150,90 175,155 215,225 175,300 235,350 285,420" fill="none" stroke="#5b6b70" stroke-width="1.5" stroke-dasharray="3 4"/><path d="M141 102 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="168" y="98" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#273a41">Tunstall</text><path d="M166 167 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="193" y="163" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#273a41">Burslem</text><path d="M206 237 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="233" y="233" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#273a41">Hanley</text><path d="M166 312 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="193" y="308" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#273a41">Stoke</text><path d="M226 362 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="253" y="358" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#a64b52">Fenton</text><path d="M276 432 q-3 -14 5 -22 q2 -4 2 -10 h4 q0 6 2 10 q8 8 5 22 z" fill="#efe3d0" stroke="#273a41" stroke-width="1.5"/><text x="303" y="428" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#273a41">Longton</text><text x="253" y="376" text-anchor="start" font-family="Georgia, serif" font-size="11" fill="#a64b52" font-style="italic">left out of the "Five Towns"</text></svg>