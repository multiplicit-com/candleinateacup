<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Three candles seen from above. A cup up to about 9 centimetres across has one wick in the middle. A vessel 9.5 to 13 centimetres across has two wicks, each about a quarter of the width in from the side, and their melt pools meet in the middle. A vessel over 13 centimetres across has three wicks in a triangle, each about halfway between the centre and the side."><rect width="640" height="300" rx="14" fill="#fbf7f1"/><text x="320.0" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#273a41">Seen from above: where the wicks go</text><circle cx="105" cy="150" r="59" fill="#fff" stroke="#273a41" stroke-width="2.5"/><circle cx="105" cy="150" r="52" fill="#f3e6c9" stroke="#273a41" stroke-width="1" opacity=".9"/><circle cx="105" cy="150" r="52" fill="#e8cf95" opacity=".75"/><circle cx="105" cy="150" r="4.5" fill="#273a41"/><text x="105" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">One wick</text><text x="105" y="277" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">up to about 9cm</text><circle cx="310" cy="150" r="77" fill="#fff" stroke="#273a41" stroke-width="2.5"/><circle cx="310" cy="150" r="70" fill="#f3e6c9" stroke="#273a41" stroke-width="1" opacity=".9"/><circle cx="275.0" cy="150" r="39.2" fill="#e8cf95" opacity=".75"/><circle cx="275.0" cy="150" r="4.5" fill="#273a41"/><circle cx="345.0" cy="150" r="39.2" fill="#e8cf95" opacity=".75"/><circle cx="345.0" cy="150" r="4.5" fill="#273a41"/><text x="310" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Two wicks, 9.5cm to 13cm</text><text x="310" y="277" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">each about a quarter of the way in</text><circle cx="525" cy="150" r="89" fill="#fff" stroke="#273a41" stroke-width="2.5"/><circle cx="525" cy="150" r="82" fill="#f3e6c9" stroke="#273a41" stroke-width="1" opacity=".9"/><circle cx="525.0" cy="109.0" r="42.64" fill="#e8cf95" opacity=".75"/><circle cx="525.0" cy="109.0" r="4.5" fill="#273a41"/><circle cx="489.492958444838" cy="170.5" r="42.64" fill="#e8cf95" opacity=".75"/><circle cx="489.492958444838" cy="170.5" r="4.5" fill="#273a41"/><circle cx="560.507041555162" cy="170.50000000000003" r="42.64" fill="#e8cf95" opacity=".75"/><circle cx="560.507041555162" cy="170.50000000000003" r="4.5" fill="#273a41"/><text x="525" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Three wicks, over 13cm</text><text x="525" y="277" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">in a triangle, halfway to the side</text></svg>