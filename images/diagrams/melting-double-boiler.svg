<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 258" role="img" aria-label="Two-step diagram. First, old candle wax melts in a metal jug standing in a saucepan of simmering water, with a thermometer in the wax. Second, the melted wax is poured through a fine strainer into a clean jug to catch soot and bits of wick."><rect width="500" height="258" rx="14" fill="#fbf7f1"/><path d="M30 120 h170 v70 a10 10 0 0 1 -10 10 h-150 a10 10 0 0 1 -10 -10z" fill="#fff" stroke="#273a41" stroke-width="2.5"/><path d="M200 130 h40" stroke="#273a41" stroke-width="5" stroke-linecap="round"/><rect x="32" y="150" width="166" height="48" fill="#cfe0ea"/><path d="M75 80 h80 l-5 112 h-70 z" fill="#c9cfd3" stroke="#273a41" stroke-width="2.5"/><path d="M75 80 l-12 -9" stroke="#273a41" stroke-width="2.5"/><rect x="81" y="110" width="68" height="78" fill="#f3e6c9"/><circle cx="52" cy="176" r="3" fill="#fff" stroke="#4c718e" stroke-width="1"/><circle cx="180" cy="170" r="3" fill="#fff" stroke="#4c718e" stroke-width="1"/><circle cx="170" cy="182" r="3" fill="#fff" stroke="#4c718e" stroke-width="1"/><path d="M135 50 L128 160" stroke="#a64b52" stroke-width="3" stroke-linecap="round"/><circle cx="128" cy="160" r="4" fill="#a64b52"/><path d="M50 215 c5 -6 10 -6 15 0 s10 6 15 0 M150 215 c5 -6 10 -6 15 0 s10 6 15 0" fill="none" stroke="#f29b38" stroke-width="2"/><text x="115" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#273a41">1. Melt in a jug in simmering water</text><path d="M300 60 h70 l-5 50 h-60z" fill="#c9cfd3" stroke="#273a41" stroke-width="2.5" transform="rotate(-35 335 85)"/><path d="M352 112 C350 125 350 135 350 140" stroke="#e8cf95" stroke-width="5"/><path d="M318 140 h64 l-12 18 h-40z" fill="#fff" stroke="#273a41" stroke-width="2"/><path d="M322 146 h56" stroke="#273a41" stroke-width="1" stroke-dasharray="2 2"/><circle cx="338" cy="150" r="2" fill="#273a41"/><circle cx="352" cy="150" r="2" fill="#273a41"/><circle cx="363" cy="150" r="2" fill="#273a41"/><path d="M314 162 h72 l-6 50 h-60z" fill="#c9cfd3" stroke="#273a41" stroke-width="2.5"/><rect x="321" y="182" width="58" height="27" fill="#f3e6c9"/><text x="350" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#273a41">2. Strain out soot and bits</text><text x="250" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b6b70" font-style="italic">Old wick, soot and debris stay in the strainer.</text></svg>