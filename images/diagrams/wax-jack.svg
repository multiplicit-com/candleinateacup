<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="How a wax jack works. A long, thin wax taper is wound round a reel between two uprights. Its free end runs up through a clip at the top, where it is lit. As the taper burns down, you loosen the clip and pull up a little more from the reel. Closing the clip over the flame puts it out, and a tray underneath catches drips."><rect width="640" height="330" rx="14" fill="#fbf7f1"/><path d="M60 270 h300 l-12 16 h-276 z" fill="#fff" stroke="#273a41" stroke-width="2.5"/><path d="M80 286 l-8 18 M340 286 l8 18" stroke="#273a41" stroke-width="2.5" stroke-linecap="round"/><path d="M95 270 V70 H300 V270" fill="none" stroke="#273a41" stroke-width="4" stroke-linejoin="round"/><rect x="110" y="150" width="170" height="90" rx="12" fill="#f3e6c9" stroke="#273a41" stroke-width="2"/><path d="M118 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M132 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M146 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M160 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M174 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M188 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M202 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M216 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M230 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M244 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M258 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><path d="M272 150 q7 45 0 90" fill="none" stroke="#d9c79e" stroke-width="2"/><circle cx="95" cy="195" r="6" fill="#273a41"/><circle cx="300" cy="195" r="6" fill="#273a41"/><path d="M270 240 C300 240 300 200 290 170 C282 140 282 110 282 82" fill="none" stroke="#f3e6c9" stroke-width="9" stroke-linecap="round"/><path d="M270 240 C300 240 300 200 290 170 C282 140 282 110 282 82" fill="none" stroke="#273a41" stroke-width="1" stroke-dasharray="3 4"/><rect x="268" y="70" width="28" height="12" rx="3" fill="#c9a14a" stroke="#273a41" stroke-width="2"/><path d="M296 76 h28" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><rect x="278" y="52" width="8" height="20" rx="2" fill="#f3e6c9" stroke="#273a41" stroke-width="1.5"/><path d="M282 22 c8 10 8 22 0 28 c-8 -6 -8 -18 0 -28 z" fill="#c9a14a" stroke="#a64b52" stroke-width="1.5"/><path d="M318 210 v-60" stroke="#4c718e" stroke-width="2.5" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4c718e"/></marker></defs><text x="370" y="40" font-family="Georgia, serif" font-size="14" fill="#273a41"><tspan x="370" dy="0">1. The clip grips the taper.</tspan><tspan x="370" dy="18">Light the end above it.</tspan></text><text x="370" y="100" font-family="Georgia, serif" font-size="14" fill="#273a41"><tspan x="370" dy="0">2. Close the clip over the</tspan><tspan x="370" dy="18">flame to put it out.</tspan></text><text x="370" y="170" font-family="Georgia, serif" font-size="14" fill="#4c718e"><tspan x="370" dy="0">3. As it burns down, loosen</tspan><tspan x="370" dy="18">the clip and pull up a little</tspan><tspan x="370" dy="18">more taper from the reel.</tspan></text><text x="370" y="250" font-family="Georgia, serif" font-size="14" fill="#273a41"><tspan x="370" dy="0">4. A tray underneath</tspan><tspan x="370" dy="18">catches any drips.</tspan></text><text x="120" y="138" font-family="Georgia, serif" font-size="14" fill="#273a41"><tspan x="120" dy="0">Coiled wax taper on a reel</tspan></text></svg>