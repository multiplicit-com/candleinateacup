<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Three steps to measure a teacup. One, fill it with water to about 1cm below the rim. Two, tip the water into a measuring jug and read the millilitres. Three, dry the cup completely, because water and wax do not mix. For example, 200 millilitres of water times 0.86 is about 172 grams of soy wax."><rect width="640" height="290" rx="14" fill="#fbf7f1"/><defs><marker id="ma" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b70"/></marker></defs><path d="M48.0 80 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z" fill="#fff"/><clipPath id="u1"><path d="M48.0 80 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z"/></clipPath><g clip-path="url(#u1)"><rect x="43.0" y="92" width="130" height="90" fill="#cfe0ea"/></g><path d="M48.0 80 h120 c0 64.0 -26.4 80 -60.0 80 s-60.0 -16.0 -60.0 -80 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M165.0 92.0 c30.0 -6 32.400000000000006 36.0 2.4 44.0" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M34.0 92H172.0" stroke="#a64b52" stroke-width="1.5" stroke-dasharray="4 3"/><text x="32.0" y="96" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#a64b52">1cm</text><text x="108" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">1. Fill with water</text><text x="108" y="223" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">to about 1cm below the rim</text><path d="M206 120H236" stroke="#5b6b70" stroke-width="2" marker-end="url(#ma)"/><path d="M257.0 70 h86 l-6 100 h-74 z" fill="#fff" stroke="#273a41" stroke-width="2.5" stroke-linejoin="round"/><path d="M261.0 118 h78 l-4.2 49 h-69 z" fill="#cfe0ea"/><path d="M341.0 86 c26 4 26 52 -6 58" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M257.0 70 l-10 -8" stroke="#273a41" stroke-width="2.5" stroke-l