<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 245" role="img" aria-label="Two diagrams. A teacup candle burned down to about 1 centimetre of wax with a dashed line marking where to stop, and a close-up of a wick trimmed to 5 millimetres before lighting."><rect width="420" height="245" rx="14" fill="#fbf7f1"/><path d="M30.0 70 h150 c0 88.0 -33.0 110 -75.0 110 s-75.0 -22.0 -75.0 -110 z" fill="#fff"/><clipPath id="u9"><path d="M30.0 70 h150 c0 88.0 -33.0 110 -75.0 110 s-75.0 -22.0 -75.0 -110 z"/></clipPath><g clip-path="url(#u9)"><rect x="25.0" y="160" width="160" height="120" fill="#f3e6c9"/></g><path d="M30.0 70 h150 c0 88.0 -33.0 110 -75.0 110 s-75.0 -22.0 -75.0 -110 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M177.0 86.5 c37.5 -6 40.5 49.5 3.0 60.50000000000001" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M15.0 183h180.0" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><path d="M105 160V152" stroke="#273a41" stroke-width="2"/><path d="M35 160H175" stroke="#a64b52" stroke-width="2" stroke-dasharray="5 4"/><text x="105" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a64b52">stop here</text><text x="105" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#273a41">Stop with about 1cm left</text><rect x="255" y="140" width="110" height="40" fill="#f3e6c9" stroke="#273a41" stroke-width="2"/><path d="M310 140 V115" stroke="#273a41" stroke-width="3"/><path d="M310 115 V95" stroke="#273a41" stroke-width="3" stroke-dasharray="3 3" opacity=".5"/><path d="M280 112 L340 118" stroke="#a64b52" stroke-width="2"/><defs><marker id="m7" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c718e"/></marker></defs><path d="M340 140 V117" stroke="#4c718e" stroke-width="2" marker-start="url(#m7)" marker-end="url(#m7)"/><text x="348" y="133" text-anchor="start" font-family="Georgia, serif" font-size="13" fill="#4c718e">5mm</text><text x="310" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#273a41">Trim the wick to 5mm</text><text x="310" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70" font-style="italic">before each burn</text></svg>