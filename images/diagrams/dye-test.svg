<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 255" role="img" aria-label="Diagram of melted pink wax in a jug looking dark red, and a few drops of the same wax set on a white saucer showing the lighter pink it will really be."><rect width="400" height="255" rx="14" fill="#fbf7f1"/><path d="M60 80 h90 l-6 110 h-78 z" fill="#c9cfd3" stroke="#273a41" stroke-width="2.5"/><path d="M60 80 l-14 -10" stroke="#273a41" stroke-width="2.5"/><path d="M150 95 c25 0 25 50 -4 55" fill="none" stroke="#273a41" stroke-width="2.5"/><rect x="66" y="100" width="78" height="86" fill="#b0434f"/><text x="105" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#273a41">Melted, it looks darker</text><defs><marker id="m4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c718e"/></marker></defs><path d="M175 135 H225" stroke="#4c718e" stroke-width="2.5" marker-end="url(#m4)"/><text x="200" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#4c718e">a few drops</text><ellipse cx="310" cy="150" rx="75" ry="24" fill="#fff" stroke="#273a41" stroke-width="2.5"/><ellipse cx="310" cy="150" rx="45" ry="13" fill="none" stroke="#273a41" stroke-width="1" opacity=".4"/><ellipse cx="292" cy="148" rx="13" ry="5" fill="#dc8e97"/><ellipse cx="326" cy="153" rx="10" ry="4" fill="#dc8e97"/><text x="310" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#273a41">Set on a white saucer,</text><text x="310" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#273a41">the real colour</text><text x="200" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Test the colour before you pour</text></svg>