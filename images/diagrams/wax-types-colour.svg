<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Four teacup candles with the same pink dye. Soy comes out soft and pastel, a coconut blend comes out even and creamy, paraffin comes out brighter and glossy, and beeswax stays a natural golden yellow."><rect width="600" height="260" rx="14" fill="#fbf7f1"/><text x="300" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">The same drop of pink dye in four waxes</text><path d="M35.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="#fff"/><clipPath id="u5"><path d="M35.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z"/></clipPath><g clip-path="url(#u5)"><rect x="30.0" y="92" width="120" height="82" fill="#efc9cc"/></g><path d="M35.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M24.0 155h132.0" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><text x="90" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Soy</text><text x="90" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">soft, pastel, matt</text><path d="M175.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="#fff"/><clipPath id="u6"><path d="M175.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z"/></clipPath><g clip-path="url(#u6)"><rect x="170.0" y="92" width="120" height="82" fill="#ebb3b9"/></g><path d="M175.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M164.0 155h132.0" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><text x="230" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Coconut blend</text><text x="230" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">even, creamy</text><path d="M315.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="#fff"/><clipPath id="u7"><path d="M315.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z"/></clipPath><g clip-path="url(#u7)"><rect x="310.0" y="92" width="120" height="82" fill="#d9707c"/><ellipse cx="352" cy="100" rx="16" ry="4" fill="#fff" opacity=".55"/></g><path d="M315.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M304.0 155h132.0" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><text x="370" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Paraffin</text><text x="370" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">brighter, glossy</text><path d="M455.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="#fff"/><clipPath id="u8"><path d="M455.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z"/></clipPath><g clip-path="url(#u8)"><rect x="450.0" y="92" width="120" height="82" fill="#e8c264"/></g><path d="M455.0 80 h110 c0 57.6 -24.2 72 -55.0 72 s-55.0 -14.4 -55.0 -72 z" fill="none" stroke="#273a41" stroke-width="2.5"/><path d="M444.0 155h132.0" stroke="#273a41" stroke-width="3" stroke-linecap="round"/><text x="510" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">Beeswax</text><text x="510" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5b6b70">natural golden</text><text x="300" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b6b70" font-style="italic">Beeswax is already yellow, so it only takes warm, deep colours.</text></svg>