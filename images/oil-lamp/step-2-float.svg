<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Diagram of the parts of a homemade floating wick: a thin slice of cork, a small disc of kitchen foil that goes on top of it, and a short piece of cotton wick pushed through the middle of both, shown separately and then put together."><rect width="400" height="250" rx="14" fill="#fbf7f1"/><text x="200" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#273a41">The parts of a floating wick</text><rect x="45" y="70" width="70" height="20" rx="4" fill="#c89a63" stroke="#273a41" stroke-width="2"/><circle cx="80" cy="80" r="3" fill="#273a41"/><text x="80" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b6b70">thin cork slice</text><ellipse cx="200" cy="80" rx="34" ry="8" fill="#dfe4e6" stroke="#273a41" stroke-width="2"/><circle cx="200" cy="80" r="3" fill="#273a41"/><text x="200" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b6b70">foil disc</text><path d="M320 55V105" stroke="#273a41" stroke-width="3"/><text x="320" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5b6b70">cotton wick</text><rect x="172.0" y="172.0" width="56.0" height="14.0" rx="2" fill="#c89a63" stroke="#273a41" stroke-width="1.5"/><rect x="178.0" y="168.0" width="44.0" height="5.0" fill="#cfd6d9" stroke="#273a41" stroke-width="1"/><path d="M200 200.0V156.0" stroke="#273a41" stroke-width="2"/><text x="200" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#273a41" font-style="italic">assembled</text></svg>